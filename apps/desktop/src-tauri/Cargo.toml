[package]
name = "huinet-desktop"
version = "2.0.0"
description = "HuiNet Local Agent Fabric desktop shell"
authors = ["HuiNet"]
edition = "2021"

[lib]
name = "huinet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
